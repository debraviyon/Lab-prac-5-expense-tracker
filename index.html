<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h3>Personal Expense Tracker 💗</h3>
    </nav>


    <div class="container">

        <!-- Dashboard Heading -->
        <h2>My Financial Dashboard</h2>


        <!-- Summary Cards -->
        <div class="row">

            <!-- Total Income -->
            <div class="col-md-4 mb-3">

                <div class="card p-3">

                    <h3>Total Income</h3>

                    <p id="totalIncome">LKR 0.00</p>

                </div>

            </div>


            <!-- Total Expenses -->
            <div class="col-md-4 mb-3">

                <div class="card p-3">

                    <h3>Total Expenses</h3>

                    <p id="totalExpenses">LKR 0.00</p>

                </div>

            </div>


            <!-- Current Balance -->
            <div class="col-md-4 mb-3">

                <div class="card p-3">

                    <h3>Current Balance</h3>

                    <p id="balance">LKR 0.00</p>

                </div>

            </div>

        </div>


        <hr>


        <!-- Transaction Form -->
        <h2>Add Transaction</h2>

        <form id="transactionForm">

            <!-- Transaction Type -->
            <div class="mb-3">

                <label class="form-label">Transaction Type</label>

                <select class="form-control" id="type" required>

                    <option value="">Choose one...</option>

                    <option value="Income">Income</option>

                    <option value="Expense">Expense</option>

                </select>

            </div>


            <!-- Amount -->
            <div class="mb-3">

                <label class="form-label">Amount (LKR)</label>

                <input type="number"
                    class="form-control"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required>

            </div>


            <!-- Category -->
            <div class="mb-3">

                <label class="form-label">Category</label>

                <input type="text"
                    class="form-control"
                    id="category"
                    placeholder="Enter category"
                    required>

            </div>


            <!-- Description -->
            <div class="mb-3">

                <label class="form-label">Description</label>

                <textarea class="form-control"
                    id="description"
                    placeholder="Enter description"
                    required></textarea>

            </div>


            <!-- Date -->
            <div class="mb-3">

                <label class="form-label">Date</label>

                <input type="date"
                    class="form-control"
                    id="date"
                    required>

            </div>


            <!-- Buttons -->
            <button type="submit" class="btn btn-primary">

                Add Transaction

            </button>


            <button type="reset" class="btn btn-secondary">

                Clear

            </button>

        </form>


        <hr>


        <!-- Transaction History -->
        <h2>Transaction History</h2>


        <!-- Search Transactions -->
        <input type="text"
            id="searchInput"
            class="form-control mb-3"
            placeholder="Search by description or category...">


        <!-- Filter Transactions -->
        <select id="filterType" class="form-control mb-3">

            <option value="All">All Transactions</option>

            <option value="Income">Income Only</option>

            <option value="Expense">Expenses Only</option>

        </select>


        <!-- Transaction Table -->
        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Description</th>

                        <th>Type</th>

                        <th>Category</th>

                        <th>Amount</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="transactionTable">

                </tbody>

            </table>

        </div>


    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
